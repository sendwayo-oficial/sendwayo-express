name: SENDWAYO — verificación de acceso a Firebase (solo lectura)

on:
  push:
    branches: [fusion-point-a-b-20261010]
    paths:
      - '.github/workflows/fusion-firebase-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirmar que el proyecto objetivo existe en la configuración
        run: |
          test "sendwayo-express-app-101" = "sendwayo-express-app-101"
          echo "Proyecto objetivo: sendwayo-express-app-101"
      - name: Comprobar acceso de solo lectura a Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo '::error::Falta el secreto FIREBASE_TOKEN. No se ha contactado ni modificado Firebase.'
            exit 1
          fi
          npm install --global firebase-tools
          firebase projects:list --json --token "$FIREBASE_TOKEN" > /tmp/sendwayo-projects.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('/tmp/sendwayo-projects.json','utf8');
          if(!raw.includes('sendwayo-express-app-101')) {
            console.error('El token no lista sendwayo-express-app-101; se detiene sin cambios.');
            process.exit(2);
          }
          console.log('El proyecto sendwayo-express-app-101 es visible para el token.');
          NODE
          firebase functions:list --project sendwayo-express-app-101 --token "$FIREBASE_TOKEN" --json > /tmp/sendwayo-functions.json
          firebase hosting:sites:list --project sendwayo-express-app-101 --token "$FIREBASE_TOKEN" --json > /tmp/sendwayo-sites.json
          node - <<'NODE'
          const fs=require('fs');
          for (const file of ['/tmp/sendwayo-functions.json','/tmp/sendwayo-sites.json']) {
            let j;
            try { j=JSON.parse(fs.readFileSync(file,'utf8')); }
            catch { console.log(file+': salida no JSON; revisar logs.'); continue; }
            const rows=Array.isArray(j)?j:(j.result||j.functions||j.sites||[]);
            console.log(file+': '+rows.map(x=>x.name||x.id||x.functionId||x.siteId||'').filter(Boolean).join(', '));
          }
          NODE
          echo 'Fin de verificación: solo lectura. No se desplegó nada ni se modificaron balances.'
