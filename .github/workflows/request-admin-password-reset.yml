name: One-time SENDWAYO admin password recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/request-admin-password-reset.yml"

permissions:
  contents: read

jobs:
  send-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request Firebase password reset email for existing admin account
        env:
          RESET_EMAIL: sendwayoexpress@gmail.com
        run: |
          set -euo pipefail
          node <<'NODE'
          const configUrl = 'https://sendwayo-express.web.app/__/firebase/init.json';
          async function main() {
            const cfgResponse = await fetch(configUrl, { redirect: 'follow' });
            if (!cfgResponse.ok) throw new Error('Could not load Firebase public web configuration.');
            const cfg = await cfgResponse.json();
            if (cfg.projectId !== 'sendwayo-express' || !cfg.apiKey) {
              throw new Error('Firebase project configuration did not match the verified account project.');
            }
            const response = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=' + encodeURIComponent(cfg.apiKey), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ requestType: 'PASSWORD_RESET', email: process.env.RESET_EMAIL })
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              const code = body?.error?.message || 'FIREBASE_RESET_REQUEST_FAILED';
              throw new Error('Firebase did not accept the password-reset request: ' + String(code).slice(0, 120));
            }
            console.log('Firebase accepted the password-reset email request for the existing admin account. No password, token, or financial data was read or changed.');
          }
          main().catch(err => { console.error(err.message); process.exit(1); });
          NODE
