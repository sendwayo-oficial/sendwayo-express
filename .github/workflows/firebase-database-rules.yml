name: Publicar SENDWAYO EXPRESS en Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/**'
      - 'sw.js'
      - 'firebase.json'
      - '.firebaserc'
      - 'database.rules.json'
      - '.github/workflows/firebase-database-rules.yml'

permissions:
  contents: read

concurrency:
  group: sendwayo-firebase-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validar y publicar Hosting + Realtime Database
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar configuración del proyecto
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cfg = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const rc = JSON.parse(fs.readFileSync('.firebaserc', 'utf8'));
          if (rc.projects?.default !== 'sendwayo-express') {
            throw new Error('El proyecto predeterminado de .firebaserc no coincide con sendwayo-express.');
          }
          if (cfg.database?.rules !== 'database.rules.json') {
            throw new Error('No está configurado database.rules.json.');
          }
          if (cfg.hosting?.public !== '.') {
            throw new Error('Firebase Hosting debe publicar la raíz del sitio donde está index.html.');
          }
          if (!fs.existsSync('index.html') || !fs.existsSync('database.rules.json')) {
            throw new Error('Falta index.html o database.rules.json.');
          }
          console.log('Configuración validada: Hosting sendwayo-express-app-101; Realtime Database sendwayo-express.');
          NODE

      - name: Preparar credenciales de Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Preferir la cuenta de servicio. Permitir FIREBASE_TOKEN como respaldo
          # para repositorios que ya tengan ese secreto configurado.
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            CREDENTIAL_FILE="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIAL_FILE"
            chmod 600 "$CREDENTIAL_FILE"

            node -e 'const fs=require("node:fs"); const key=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(key.type!=="service_account" || key.project_id!=="sendwayo-express" || !key.client_email || !key.private_key) throw new Error("FIREBASE_SERVICE_ACCOUNT no es una clave válida para sendwayo-express."); console.log("Credencial de cuenta de servicio validada."); console.log("CUENTA_DE_SERVICIO_FIREBASE="+key.client_email); console.log("PROYECTO_DE_LA_CREDENCIAL="+key.project_id);' "$CREDENTIAL_FILE"

            echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIAL_FILE" >> "$GITHUB_ENV"
            echo "FIREBASE_AUTH_MODE=service-account" >> "$GITHUB_ENV"
            echo "Autenticación Firebase configurada mediante cuenta de servicio."
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "FIREBASE_AUTH_MODE=token" >> "$GITHUB_ENV"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT no está configurado; se utilizará el secreto FIREBASE_TOKEN existente como respaldo."
          else
            echo "::error::No hay credenciales de despliegue configuradas. Añade FIREBASE_SERVICE_ACCOUNT (JSON de cuenta de servicio) en Settings > Secrets and variables > Actions. Como alternativa, añade FIREBASE_TOKEN. No pegues claves privadas en el código ni en el chat."
            exit 1
          fi

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Publicar el sitio en el dominio de prueba de Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            firebase deploy --only hosting --project sendwayo-express-app-101 --non-interactive --token "$FIREBASE_TOKEN"
          else
            firebase deploy --only hosting --project sendwayo-express-app-101 --non-interactive
          fi

      - name: Publicar las reglas de Realtime Database del backend
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${FIREBASE_AUTH_MODE:-}" = "token" ]; then
            firebase deploy --only database --project sendwayo-express --non-interactive --token "$FIREBASE_TOKEN"
          else
            firebase deploy --only database --project sendwayo-express --non-interactive
          fi

      - name: Eliminar credencial temporal
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
