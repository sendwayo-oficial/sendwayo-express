name: Publicar SENDWAYO EXPRESS en Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/**'
      - 'sw.js'
      - 'firebase.json'
      - '.firebaserc'
      - 'database.rules.json'
      - '.github/workflows/firebase-database-rules.yml'

permissions:
  contents: read

concurrency:
  group: sendwayo-firebase-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validar y publicar Hosting + Realtime Database
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar configuración del proyecto
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cfg = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const rc = JSON.parse(fs.readFileSync('.firebaserc', 'utf8'));
          if (rc.projects?.default !== 'sendwayo-express') {
            throw new Error('El proyecto predeterminado de .firebaserc no coincide con sendwayo-express.');
          }
          if (cfg.database?.rules !== 'database.rules.json') {
            throw new Error('No está configurado database.rules.json.');
          }
          if (cfg.hosting?.public !== '.') {
            throw new Error('Firebase Hosting debe publicar la raíz del sitio donde está index.html.');
          }
          if (!fs.existsSync('index.html') || !fs.existsSync('database.rules.json')) {
            throw new Error('Falta index.html o database.rules.json.');
          }
          console.log('Configuración validada: Hosting sendwayo-express-app-101; Realtime Database sendwayo-express.');
          NODE

      - name: Preparar credencial de cuenta de servicio
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT en GitHub. Añade el JSON de una cuenta de servicio de Firebase/Google Cloud en Settings > Secrets and variables > Actions. No pegues la clave en el código ni en el chat."
            exit 1
          fi
          CREDENTIAL_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIAL_FILE"
          chmod 600 "$CREDENTIAL_FILE"
          node - "$CREDENTIAL_FILE" <<'NODE'
          const fs = require('node:fs');
          const key = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (key.type !== 'service_account' || key.project_id !== 'sendwayo-express' || !key.client_email || !key.private_key) {
            throw new Error('FIREBASE_SERVICE_ACCOUNT no es una clave de cuenta de servicio válida para sendwayo-express.');
          }
          console.log('Credencial de servicio validada para el proyecto esperado.');
          NODE
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIAL_FILE" >> "$GITHUB_ENV"

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Publicar el sitio en el dominio de prueba de Firebase
        run: firebase deploy --only hosting --project sendwayo-express-app-101 --non-interactive

      - name: Publicar las reglas de Realtime Database del backend
        run: firebase deploy --only database --project sendwayo-express --non-interactive

      - name: Eliminar credencial temporal
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
