name: Legacy Realtime Database deployment disabled for A+B review
on:
  workflow_dispatch:
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Prevent applying legacy Point B rules to Point A
        run: |
          echo "Automatic RTDB deployment is disabled for the fusion branch."
          echo "database.rules.json belongs to the legacy project sendwayo-express."
          echo "Review the target project's current RTDB rules separately before any deployment."
