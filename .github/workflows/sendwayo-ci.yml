name: SENDWAYO CI - integrity check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Firebase rules JSON
        run: node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); console.log('database.rules.json OK')"
      - name: Validate inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          let n=0;
          for(const code of blocks){n++;try{new Function(code)}catch(e){console.error('Inline script #'+n+' invalido:',e.message);process.exit(1)}}
          console.log('Inline JavaScript OK:',n,'bloques');
          NODE
      - name: Check critical hardening markers
        run: |
          if grep -q 'sendwayo-fusion-import-a-b' index.html; then
            # Nueva interfaz Firebase: comprobar la capa cloud y los listeners en lugar de los IDs de la interfaz anterior.
            grep -q 'sendwayoCloud' index.html
            grep -q 'listenAdminOperations' index.html
            grep -q 'listenNotifications' index.html
            grep -q 'sendwayo-express-app-101.web.app/__/firebase/init.js' index.html
            echo "SENDWAYO fusion cloud markers OK"
          else
            # Aplicación anterior: conservar su guardarraíl original.
            grep -q 'sendwayo-professional-hardening' index.html
            grep -q 'ganancias-dia-card' index.html
            echo "SENDWAYO legacy hardening markers OK"
          fi
