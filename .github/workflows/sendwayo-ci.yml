name: SENDWAYO CI - integrity check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Firebase rules JSON
        run: node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); console.log('database.rules.json OK')"
      - name: Validate inline JavaScript with file/line diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script\s*>', html, re.I)
          count = 0
          for i, code in enumerate(blocks, 1):
              if not code.strip():
                  continue
              Path(f'/tmp/sendwayo-inline-{i}.js').write_text(code, encoding='utf-8')
              count += 1
          if count == 0:
              raise SystemExit('No inline JavaScript blocks found')
          print(f'Extracted {count} inline JavaScript blocks')
          PY
          for f in /tmp/sendwayo-inline-*.js; do
            [ -f "$f" ] || continue
            echo "Checking $f"
            node --check "$f"
          done
      - name: Validate shared Firebase contact integration
        run: |
          grep -q "sendwayoCloud = Object.freeze" index.html
          grep -q "submitOperation: invoke('submitOperation')" index.html
          grep -q "listenSharedContacts" index.html
          grep -q "syncContactDirectory" index.html
          grep -q 'scripts/sendwayo-global-suggestions-v32.js' index.html
          grep -q 'scripts/sendwayo-sidebar-numbering-v32.js' index.html
          node --check scripts/sendwayo-global-suggestions-v32.js
          node --check scripts/sendwayo-sidebar-numbering-v32.js
          echo "SENDWAYO Firebase, global contacts and sidebar numbering markers OK"