name: SENDWAYO CI - integrity check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Firebase rules JSON
        run: node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); console.log('database.rules.json OK')"
      - name: Validate inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          let n=0;
          for(const code of blocks){n++;try{new Function(code)}catch(e){console.error('Inline script #'+n+' invalido:',e.message);process.exit(1)}}
          console.log('Inline JavaScript OK:',n,'bloques');
          NODE
      - name: Validate new Stage 1 foundation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('etapa-1/index.html','utf8');
          const checks=[
            ['official SENDWAYO EXPRESS brand',html.includes('SENDWAYO EXPRESS')],
            ['official logo file exists',html.includes('../assets/sendwayo-logo-real.jpg') && fs.existsSync('assets/sendwayo-logo-real.jpg')],
            ['mobile responsive layout',/@media\s*\(max-width:\s*720px\)/.test(html)],
            ['no credential fields or simulated login',!/<input|<form|<script|localStorage/i.test(html)],
            ['clear warning before Firebase auth exists',/no escribas tu contraseña/i.test(html)],
          ];
          let failed=false;
          for(const [label,ok] of checks){console.log((ok?'PASS ':'FAIL ')+label);if(!ok)failed=true;}
          if(failed)process.exit(1);
          NODE
      - name: Validate functional requirements contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='docs/ESPECIFICACION-FUNCIONAL-SENDWAYO.md';
          const doc=fs.readFileSync(p,'utf8');
          const required=[
            'Balance RD$','Balance HTG','Comisión RD$','Comisión HTG',
            'Ganancia de Hoy en RD$','Ganancia de Hoy en HTG',
            'Tarifas locales Haití - Haití','Cuentas Bancarias Oficiales',
            'Informaciones secretas','Pago de transferencia',
            'Aprobado','Rechazado','No coincide',
            '50% de la comisión','Los agentes no reciben comisión personal',
            '10 remitentes de prueba','marca de agua repetida nueve veces',
            'Etapa 2 — Autenticación','Etapa 6 — Revisión final y publicación'
          ];
          let failed=false;
          for(const term of required){const ok=doc.includes(term);console.log((ok?'PASS ':'FAIL ')+term);if(!ok)failed=true;}
          const menu=(doc.match(/^\d+\. /gm)||[]).length;
          console.log((menu===22?'PASS ':'FAIL ')+ '22 menu modules (found '+menu+')');
          if(menu!==22)failed=true;
          if(failed)process.exit(1);
          NODE
      - name: Check critical hardening markers
        run: |
          if grep -q 'SW_POINT_A_RECOVERY_REDIRECT' index.html; then
            grep -q 'https://sendwayo-express-app-101.web.app/' index.html
            echo "SENDWAYO recovery redirect target OK"
            exit 0
          fi
          grep -q 'SENDWAYO_LEGACY_FIREBASE_CONFIG' index.html
          grep -q 'balanceDOP' index.html
          grep -q 'SENDWAYO EXPRESS — Plataforma oficial' index.html
          echo "SENDWAYO official fusion and balance markers OK"
