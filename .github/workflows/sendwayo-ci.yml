name: SENDWAYO CI - integrity check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Firebase rules JSON
        run: node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); console.log('database.rules.json OK')"
      - name: Validate inline JavaScript
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          let n=0;
          for(const code of blocks){n++;try{new Function(code)}catch(e){console.error('Inline script #'+n+' invalido:',e.message);process.exit(1)}}
          console.log('Inline JavaScript OK:',n,'bloques');
          NODE
      - name: Ensure separate-platform routes are not bundled into the existing app
        run: |
          test ! -e etapa-1/index.html
          test ! -e etapa-2/index.html
          echo "PASS Existing SENDWAYO deployment does not contain the separate platform routes"
      - name: Validate functional requirements contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='docs/ESPECIFICACION-FUNCIONAL-SENDWAYO.md';
          const doc=fs.readFileSync(p,'utf8');
          const required=[
            'Balance RD$','Balance HTG','Comisión RD$','Comisión HTG',
            'Ganancia de Hoy en RD$','Ganancia de Hoy en HTG',
            'Tarifas locales Haití - Haití','Cuentas Bancarias Oficiales',
            'Informaciones secretas','Pago de transferencia',
            'Aprobado','Rechazado','No coincide',
            '50% de la comisión','Los agentes no reciben comisión personal',
            '10 remitentes de prueba','marca de agua repetida nueve veces',
            'Etapa 2 — Autenticación','Etapa 6 — Revisión final y publicación'
          ];
          let failed=false;
          for(const term of required){const ok=doc.includes(term);console.log((ok?'PASS ':'FAIL ')+term);if(!ok)failed=true;}
          const menu=(doc.match(/^\d+\. /gm)||[]).length;
          console.log((menu===22?'PASS ':'FAIL ')+ '22 menu modules (found '+menu+')');
          if(menu!==22)failed=true;
          if(failed)process.exit(1);
          NODE
      - name: Check secure entry and Firebase registration approval
        run: |
          set -euo pipefail
          grep -q 'register-password-confirm' SENDWAYO-V7-FAST-ENTRY.html
          grep -q 'createUserWithEmailAndPassword' SENDWAYO-V7-FAST-ENTRY.html
          grep -q 'sendPasswordResetEmail' SENDWAYO-V7-FAST-ENTRY.html
          grep -q 'sendwayoexpress@gmail.com' SENDWAYO-V7-FAST-ENTRY.html
          grep -q 'sendwayo-v7-self-registration-approval' SENDWAYO-EXPRESS-V7-CORREGIDO-DOP-BALANCES-COMISIONES-AVISOS.html
          grep -q 'sendwayo_express_v2/users/' SENDWAYO-EXPRESS-V7-CORREGIDO-DOP-BALANCES-COMISIONES-AVISOS.html
          grep -q 'sendwayo_express_v2/requests/' SENDWAYO-EXPRESS-V7-CORREGIDO-DOP-BALANCES-COMISIONES-AVISOS.html
          grep -q 'balanceDOP' SENDWAYO-EXPRESS-V7-CORREGIDO-DOP-BALANCES-COMISIONES-AVISOS.html
          echo "SENDWAYO secure registration, admin approval and Firebase identity markers OK"
      - name: Run V7 regression tests
        run: |
          set -euo pipefail
          for test_file in tests/*.test.cjs; do
            echo "Running $test_file"
            node "$test_file"
          done
