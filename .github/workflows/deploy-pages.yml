name: Publish approved SENDWAYO EXPRESS - shared balances

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: Apply verified V7 login and welcome fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          css = r'''<style id="sendwayo-v7-brand-and-login-performance-fix">
          .sendwayo-home-header-inner{padding:15px 28px!important;min-height:94px!important}
          .sendwayo-home-brand{gap:17px!important}
          .sendwayo-home-brand img{height:72px!important;max-height:72px!important;max-width:205px!important;width:auto!important;object-fit:contain!important;background:#fff!important;border-radius:12px!important;padding:3px!important}
          .sendwayo-home-brand strong{font-size:19px!important;letter-spacing:.07em!important}
          .sendwayo-home-brand span{font-size:12px!important}
          .sendwayo-home-login{padding:14px 27px!important;font-size:14px!important;background:linear-gradient(135deg,#12365b,#087eae)!important;box-shadow:0 8px 22px rgba(8,65,105,.24)!important}
          .sendwayo-home-content{padding-top:34px!important;padding-bottom:42px!important}
          .sendwayo-home-main-photo{min-height:390px!important;border:1px solid rgba(255,255,255,.35)!important;box-shadow:0 18px 42px rgba(15,36,64,.19)!important}
          .sendwayo-home-aside{border-top:4px solid #e4a83b!important}
          .sendwayo-home-service-grid article{transition:transform .2s ease,box-shadow .2s ease!important;border:1px solid #e4eaf1!important;box-shadow:0 7px 20px rgba(15,36,64,.07)!important}
          .sendwayo-home-service-grid article:hover{transform:translateY(-3px)!important;box-shadow:0 13px 26px rgba(15,36,64,.12)!important}
          @media(max-width:760px){.sendwayo-home-header-inner{min-height:78px!important;padding:10px 14px!important;gap:8px!important}.sendwayo-home-brand{gap:9px!important}.sendwayo-home-brand img{height:54px!important;max-width:112px!important}.sendwayo-home-brand strong{font-size:13px!important}.sendwayo-home-brand span{font-size:9px!important}.sendwayo-home-login{padding:11px 14px!important;font-size:11px!important;white-space:nowrap!important}.sendwayo-home-content{padding:18px 14px 28px!important}.sendwayo-home-main-photo{height:340px!important;min-height:300px!important}}
          </style>'''
          paths = [Path('SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html'), Path('site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html'), Path('site/index.html')]
          for path in paths:
              html = path.read_text(encoding='utf-8')
              old = "const ADMIN_EMAIL = 'sendwayoexpress@gmail.com';"
              if old in html:
                  html = html.replace(old, "const ADMIN_EMAIL = 'ideletteismorin@gmail.com';")
              if "const ADMIN_EMAIL = 'ideletteismorin@gmail.com';" not in html:
                  raise SystemExit(f'No se pudo confirmar el correo administrativo correcto en {path}')
              html = html.replace('  setInterval(scrubLegacyCredentials,500);', '  // Limpieza única: no escanear localStorage cada 500 ms y bloquear la interfaz.\n')
              if 'sendwayo-v7-brand-and-login-performance-fix' not in html:
                  if '</body>' not in html: raise SystemExit(f'No se encontró </body> en {path}')
                  html = html.replace('</body>', css + '\\n</body>')
              path.write_text(html, encoding='utf-8')
          print('PASS: correo administrador, limpieza no repetitiva y logo/diseño V7 aplicados.')
          PY

      - name: Verify the selected shared-balance version
        shell: bash
        run: |
          set -euo pipefail
          test -s site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html
          test -s site/index.html
          cmp -s site/index.html site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('site/index.html').read_text(encoding='utf-8')
          assert re.search(r'<title>SENDWAYO EXPRESS - V7[^<]*</title>', html), 'Título V7 ausente'
          assert len(re.findall(r'\blet\s+ADMIN\s*=', html)) == 1
          assert "function balanceOwner(a){return a&&roleOf(a)==='AGENTE'?(adminAccount()||a):(a||null);}" in html
          assert "function commissionOwner(a){return a&&roleOf(a)==='AGENTE'?(adminAccount()||a):(a||null);}" in html
          expected = {
            'AGENTES': ['AG-HERACE', 'AG-JULIE', 'AG-BETINA', 'AGE00004', 'AG-MIKE'],
            'REMITENTES': ['REM-DANIA', 'REM-EDITA', 'REM-NENES', 'REM-FLEURANVIL', 'REM-WILNORD', 'ID65734453', 'ID65734454', 'ID65734455', 'ID65734456', 'ID65734457', 'REM-011', 'REM-012', 'REM-013', 'REM-014', 'REM-015'],
          }
          for name, ids in expected.items():
            m = re.search(rf'let\s+{name}\s*=\s*(\[[\s\S]*?\]);', html)
            assert m and re.findall(r"id\s*:\s*['\"]([^'\"]+)['\"]", m.group(1)) == ids, name
          refs = set(re.findall(r'assets/([A-Za-z0-9._-]+)', html))
          assert {'sendwayo-logo-real.jpg', 'sendwayo-servicios.jpg'}.issubset(refs), f'Faltan imágenes de portada: {sorted(refs)}'
          for name in refs:
            assert (Path('site/assets') / name).is_file(), name
          assert html.rstrip().endswith('</html>')
          print('PASS: versión de balance compartido, 5 agentes, 15 remitentes y 9 imágenes.')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Wait for automatic branch Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          query = urllib.parse.urlencode({"head_sha": sha, "per_page": 100})
          url = f"https://api.github.com/repos/{repo}/actions/runs?{query}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          for attempt in range(60):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  runs = json.load(response).get("workflow_runs", [])
              matches = [
                  run for run in runs
                  if run.get("name") == "pages build and deployment"
                  and run.get("event") == "dynamic"
                  and run.get("head_sha") == sha
              ]
              if matches:
                  run = max(matches, key=lambda item: item.get("run_started_at", ""))
                  if run.get("status") == "completed":
                      print(
                          "Automatic Pages build finished:",
                          run.get("conclusion"),
                          "run",
                          run.get("id"),
                      )
                      break
              time.sleep(5)
          else:
              raise SystemExit(
                  "Timed out waiting for the automatic branch Pages build; "
                  "the approved V7 deployment was not started."
              )
          PY

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the existing public URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"
          TARGET="${BASE_URL}/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html?sendwayo_release=${GITHUB_SHA}"
          curl --fail --silent --show-error --location --retry 15 --retry-all-errors --retry-delay 4 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$TARGET" -o /tmp/sendwayo-live.html
          LOCAL_SHA="$(sha256sum site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html | cut -d ' ' -f1)"
          LIVE_SHA="$(sha256sum /tmp/sendwayo-live.html | cut -d ' ' -f1)"
          test "$LOCAL_SHA" = "$LIVE_SHA"
          while IFS= read -r asset; do
            curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' "${BASE_URL}/assets/${asset}?sendwayo_release=${GITHUB_SHA}" -o /dev/null
          done < <(grep -oE 'assets/[A-Za-z0-9._-]+' site/index.html | sed 's#^assets/##' | sort -u)
          echo 'PASS: el enlace existente devuelve exactamente el HTML y sus 9 imágenes.'
