name: Publish approved SENDWAYO EXPRESS V7

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the approved V7 package
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html
          cmp -s site/index.html site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html
          grep -Fq '<title>SENDWAYO EXPRESS - V7 CORREGIDO DOP, BALANCES, COMISIONES Y AVISOS</title>' site/index.html
          grep -Fq 'let AGENTES = [' site/index.html
          grep -Fq 'let REMITENTES = [' site/index.html
          grep -Fq 'let TRANSACCIONES = []' site/index.html
          for asset in site/assets/*; do
            test -s "$asset"
          done
          test "$(find site/assets -maxdepth 1 -type f | wc -l)" -eq 9
          echo "V7 aprobada: 1 administrador, 5 agentes, 15 remitentes; transacciones de prueba vacías."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the existing public link
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"
          curl --fail --silent --show-error --retry 10 --retry-delay 4 --retry-connrefused "$BASE_URL/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html" -o /tmp/sendwayo-live.html
          cmp -s site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html /tmp/sendwayo-live.html
          for asset in site/assets/*; do
            name="$(basename "$asset")"
            curl --fail --silent --show-error "$BASE_URL/assets/$name" -o /dev/null
          done
          echo "PASS: el enlace existente y los 9 recursos publican el paquete aprobado."
