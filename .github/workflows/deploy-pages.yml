name: Publish SENDWAYO EXPRESS fast entry and V7 application

on:
  push:
    branches: [main]
    paths:
      - 'SENDWAYO-V7-FAST-ENTRY.html'
      - 'SENDWAYO-EXPRESS-V7-CORREGIDO-DOP-BALANCES-COMISIONES-AVISOS.html'
      - 'SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sendwayo-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout SENDWAYO
        uses: actions/checkout@v4

      - name: Assemble the lightweight welcome page and full V7 application
        shell: bash
        run: |
          set -euo pipefail
          test -s SENDWAYO-V7-FAST-ENTRY.html
          test -s SENDWAYO-EXPRESS-V7-CORREGIDO-DOP-BALANCES-COMISIONES-AVISOS.html
          test -s assets/sendwayo-logo-real.jpg
          rm -rf site
          mkdir -p site/assets
          cp SENDWAYO-V7-FAST-ENTRY.html site/index.html
          cp SENDWAYO-V7-FAST-ENTRY.html site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html
          cp SENDWAYO-EXPRESS-V7-CORREGIDO-DOP-BALANCES-COMISIONES-AVISOS.html site/SENDWAYO-EXPRESS-V7-CORREGIDO-DOP-BALANCES-COMISIONES-AVISOS.html
          cp -R assets/. site/assets/
          if [ -d data ]; then cp -R data site/; fi
          if [ -d scripts ]; then cp -R scripts site/; fi
          if [ -f SENDWAYO-V7-FISCAL-INTERNACIONAL.js ]; then cp SENDWAYO-V7-FISCAL-INTERNACIONAL.js site/; fi
          if [ -f .nojekyll ]; then cp .nojekyll site/; else touch site/.nojekyll; fi

          # Build Tailwind locally for the authenticated V7 workspace only.
          # The public entry uses a tiny self-contained stylesheet and one script.
          mkdir -p site/assets
          npm install --no-save tailwindcss@3.4.17
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/sendwayo-tailwind-input.css
          npx tailwindcss -i /tmp/sendwayo-tailwind-input.css -o site/assets/sendwayo-tailwind.css --content site/SENDWAYO-EXPRESS-V7-CORREGIDO-DOP-BALANCES-COMISIONES-AVISOS.html --minify
          node <<'NODE'
          const fs=require('node:fs');
          const fast='site/index.html';
          const app='site/SENDWAYO-EXPRESS-V7-CORREGIDO-DOP-BALANCES-COMISIONES-AVISOS.html';
          let html=fs.readFileSync(app,'utf8');
          const cdn='<script src="https://cdn.tailwindcss.com" defer></script>';
          if(html.includes(cdn)) html=html.replace(cdn,'<link rel="stylesheet" href="assets/sendwayo-tailwind.css">');
          fs.writeFileSync(app,html);
          const page=fs.readFileSync(fast,'utf8');
          if(Buffer.byteLength(page,'utf8')>30000) throw new Error('La bienvenida ligera supera 30 KB.');
          if((page.split('<script').length-1)!==1) throw new Error('La bienvenida debe cargar un único bloque JavaScript.');
          if((page.split('<img').length-1)!==1) throw new Error('La bienvenida debe mostrar únicamente el logo.');
          if(!page.includes('src="assets/sendwayo-logo-real.jpg"')) throw new Error('Falta el logo oficial original JPG en la portada.');
          
          if(!page.includes("const ADMIN_EMAIL='sendwayoexpress@gmail.com'")) throw new Error('El acceso administrativo no apunta a la cuenta Firebase existente.');
          if(!page.includes("addAliases(ADMIN_EMAIL,['admin-administrador','ideletteismorin@gmail.com'")) throw new Error('Falta el nombre de usuario admin-administrador enlazado a Firebase Authentication.');
          
          if(page.includes('cdn.tailwindcss.com')) throw new Error('La bienvenida no debe depender de Tailwind CDN.');
          for(const id of ['login-email','login-password','show-password','forgot-password','remember-me','login-button','register-button','register-modal','register-form','register-name','register-phone','register-email']) {
            if(!page.includes('id="'+id+'"')) throw new Error('Falta control funcional: '+id);
          }
          for(const marker of ['signInWithEmailAndPassword','sendPasswordResetEmail','setPersistence','/requests/','sendwayoExpressOfficialV7','sendwayoexpress@gmail.com']) {
            if(!page.includes(marker)) throw new Error('Falta función real de acceso: '+marker);
          }
          const scriptStart=page.indexOf('<script>');
          const scriptEnd=page.indexOf('</script>',scriptStart);
          if(scriptStart<0||scriptEnd<0||page.indexOf('<script>',scriptStart+1)>=0) throw new Error('No se encontró el script único de la portada.');
          new Function(page.slice(scriptStart+8,scriptEnd));
          if(!fs.existsSync('site/assets/sendwayo-logo-real.jpg')) throw new Error('No se copió el logo oficial original JPG.');
          if(!fs.existsSync('site/assets/sendwayo-logo-real.jpg')) throw new Error('No se conservaron los recursos del panel V7.');
          if(!fs.existsSync('site/assets/sendwayo-tailwind.css')) throw new Error('No se generó Tailwind local para V7.');
          if(fs.statSync(app).size<500000) throw new Error('El panel V7 completo no está presente.');
          console.log('PASS: bienvenida '+Buffer.byteLength(page,'utf8')+' bytes; 1 script; controles editables; alias Firebase administrativo; logo oficial original JPG; panel V7 separado.');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to the existing public URL
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the public entry and official original logo
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, time, urllib.request
          from pathlib import Path
          base=os.environ['PAGE_URL'].rstrip('/')
          release=os.environ['RELEASE_SHA']
          expected=hashlib.sha256(Path('site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html').read_bytes()).hexdigest()
          target=f"{base}/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html?sendwayo_release={release}"
          headers={'Cache-Control':'no-cache, no-store, max-age=0','Pragma':'no-cache','User-Agent':'SENDWAYO-Pages-Verification'}
          last='no response'
          for attempt in range(1,19):
              try:
                  req=urllib.request.Request(target,headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as response:
                      body=response.read()
                      last=str(response.status)
                  if hashlib.sha256(body).hexdigest()==expected:
                      print(f'PASS: public entry matches the lightweight page (attempt {attempt}).')
                      break
                  last='public content hash differs'
              except Exception as error:
                  last=repr(error)
              if attempt<18: time.sleep(5)
          else:
              raise SystemExit('Public page verification failed: '+last)
          asset=f"{base}/assets/sendwayo-logo-real.jpg?sendwayo_release={release}"
          req=urllib.request.Request(asset,headers=headers)
          with urllib.request.urlopen(req,timeout=20) as response:
              if response.status!=200: raise SystemExit('Official original logo is not reachable.')
              logo=response.read()
          if not logo.startswith(b'\xff\xd8\xff'):
              raise SystemExit('The deployed original logo is not a valid JPEG image.')
          print(f'PASS: official original logo served ({len(logo)} bytes).')
          PY
