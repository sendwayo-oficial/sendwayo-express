name: Deploy exact SENDWAYO EXPRESS V7 to the existing link

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sendwayo-oficial/sendwayo-express-oficial
          path: v7-source

      - name: Preparar la V7 original sin modificar
        shell: bash
        run: |
          set -euo pipefail
          cat v7-source/chunks/part*.txt > /tmp/SENDWAYO-V7.html
          ACTUAL_SHA="$(sha256sum /tmp/SENDWAYO-V7.html | cut -d' ' -f1)"
          EXPECTED_SHA="b71cbd277f16256162dc7d517afb0c487f8a19425ebfbff215b89b25f390c796"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(wc -c < /tmp/SENDWAYO-V7.html)" -eq 22881979
          grep -Fq '<title>SENDWAYO EXPRESS - V7 CORRECCIONES PUNTUALES</title>' /tmp/SENDWAYO-V7.html
          mkdir -p site
          cp /tmp/SENDWAYO-V7.html site/index.html
          cp /tmp/SENDWAYO-V7.html site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html
          cmp -s site/index.html site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html
          echo "V7 original verificada: $ACTUAL_SHA"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Comprobar el mismo enlace público y su contenido exacto
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"
          EXPECTED_SHA="b71cbd277f16256162dc7d517afb0c487f8a19425ebfbff215b89b25f390c796"
          curl --fail --silent --show-error --retry 10 --retry-delay 4 --retry-connrefused "$BASE_URL/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html" -o /tmp/sendwayo-live.html
          LIVE_SHA="$(sha256sum /tmp/sendwayo-live.html | cut -d' ' -f1)"
          test "$LIVE_SHA" = "$EXPECTED_SHA"
          grep -Fq '<title>SENDWAYO EXPRESS - V7 CORRECCIONES PUNTUALES</title>' /tmp/sendwayo-live.html
          echo "PASS: el enlace público contiene exactamente la V7 original: $LIVE_SHA"
