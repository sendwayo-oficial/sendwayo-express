name: Deploy SENDWAYO EXPRESS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          # Unique per workflow attempt; prevents duplicate github-pages artifacts on re-runs.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Smoke-test published SENDWAYO stage pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"
          curl --fail --silent --show-error --retry 8 --retry-delay 4 --retry-connrefused "${BASE_URL}/etapa-1/" -o /tmp/sendwayo-stage1.html
          grep -Fq 'SENDWAYO EXPRESS' /tmp/sendwayo-stage1.html
          grep -Fq 'assets/sendwayo-logo-real.jpg' /tmp/sendwayo-stage1.html
          echo "PASS Stage 1 published HTML is reachable"

          curl --fail --silent --show-error --retry 8 --retry-delay 4 --retry-connrefused "${BASE_URL}/etapa-2/" -o /tmp/sendwayo-stage2.html
          grep -Fq 'SENDWAYO EXPRESS — Acceso seguro' /tmp/sendwayo-stage2.html
          grep -Fq 'auth.signInWithEmailAndPassword(email, pass)' /tmp/sendwayo-stage2.html
          grep -Fq 'auth.sendPasswordResetEmail(email)' /tmp/sendwayo-stage2.html
          grep -Fq "openOfficialApp(credential.user, profile, raw)" /tmp/sendwayo-stage2.html
          grep -Fq "window.location.replace('../')" /tmp/sendwayo-stage2.html
          grep -Fq "firebase.initializeApp(options, 'sendwayoLegacy')" /tmp/sendwayo-stage2.html
          grep -Fq "auth = legacyApp.auth()" /tmp/sendwayo-stage2.html
          echo "PASS Stage 2 uses the official Auth instance and opens the platform"
