name: Publish approved SENDWAYO EXPRESS - shared balances

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the selected shared-balance version
        shell: bash
        run: |
          set -euo pipefail
          test -s site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html
          test -s site/index.html
          cmp -s site/index.html site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('site/index.html').read_text(encoding='utf-8')
          assert '<title>SENDWAYO EXPRESS - V7 CORRECCIONES PUNTUALES</title>' in html
          assert len(re.findall(r'\blet\s+ADMIN\s*=', html)) == 1
          assert "function balanceOwner(a){return a&&roleOf(a)==='AGENTE'?(adminAccount()||a):(a||null);}" in html
          assert "function commissionOwner(a){return a&&roleOf(a)==='AGENTE'?(adminAccount()||a):(a||null);}" in html
          expected = {
            'AGENTES': ['AG-HERACE', 'AG-JULIE', 'AG-BETINA', 'AGE00004', 'AG-MIKE'],
            'REMITENTES': ['REM-DANIA', 'REM-EDITA', 'REM-NENES', 'REM-FLEURANVIL', 'REM-WILNORD', 'ID65734453', 'ID65734454', 'ID65734455', 'ID65734456', 'ID65734457', 'REM-011', 'REM-012', 'REM-013', 'REM-014', 'REM-015'],
          }
          for name, ids in expected.items():
            m = re.search(rf'let\s+{name}\s*=\s*(\[[\s\S]*?\]);', html)
            assert m and re.findall(r"id\s*:\s*['\"]([^'\"]+)['\"]", m.group(1)) == ids, name
          refs = set(re.findall(r'assets/([A-Za-z0-9._-]+)', html))
          assert len(refs) == 9, f'Esperaba 9 recursos gráficos, encontré {len(refs)}'
          for name in refs:
            assert (Path('site/assets') / name).is_file(), name
          assert html.rstrip().endswith('</html>')
          print('PASS: versión de balance compartido, 5 agentes, 15 remitentes y 9 imágenes.')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the existing public URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"
          TARGET="${BASE_URL}/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html?sendwayo_release=${GITHUB_SHA}"
          curl --fail --silent --show-error --location --retry 15 --retry-all-errors --retry-delay 4 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$TARGET" -o /tmp/sendwayo-live.html
          LOCAL_SHA="$(sha256sum site/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html | cut -d ' ' -f1)"
          LIVE_SHA="$(sha256sum /tmp/sendwayo-live.html | cut -d ' ' -f1)"
          test "$LOCAL_SHA" = "$LIVE_SHA"
          while IFS= read -r asset; do
            curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' "${BASE_URL}/assets/${asset}?sendwayo_release=${GITHUB_SHA}" -o /dev/null
          done < <(grep -oE 'assets/[A-Za-z0-9._-]+' site/index.html | sed 's#^assets/##' | sort -u)
          echo 'PASS: el enlace existente devuelve exactamente el HTML y sus 9 imágenes.'
