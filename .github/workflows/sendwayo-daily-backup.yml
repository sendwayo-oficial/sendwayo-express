name: SENDWAYO - daily Firebase backup
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase credentials
        id: guard
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT no está configurado; respaldo omitido sin marcar el workflow como fallido."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 20
      - name: Install Firebase CLI
        if: steps.guard.outputs.ready == 'true'
        run: npm install -g firebase-tools
      - name: Prepare service account
        if: steps.guard.outputs.ready == 'true'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Export Realtime Database
        if: steps.guard.outputs.ready == 'true'
        run: |
          mkdir -p backup
          firebase database:get / --project sendwayo-express --json > "backup/sendwayo-rtdb-$(date -u +%Y-%m-%d).json"
      - name: Upload backup artifact
        if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sendwayo-rtdb-backup-${{ github.run_number }}
          path: backup/*.json
          retention-days: 30
