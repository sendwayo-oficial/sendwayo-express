name: SENDWAYO - daily Firebase backup
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase credentials
        id: guard
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT no está configurado; respaldo no ejecutado."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 20
      - name: Install Firebase CLI
        if: steps.guard.outputs.ready == 'true'
        run: npm install -g firebase-tools
      - name: Prepare service account
        if: steps.guard.outputs.ready == 'true'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Export Realtime Database
        if: steps.guard.outputs.ready == 'true'
        run: |
          mkdir -p backup
          firebase database:get / --project sendwayo-express --json > "backup/sendwayo-rtdb-$(date -u +%Y-%m-%d).json"
      - name: Validate and normalize backup JSON
        if: steps.guard.outputs.ready == 'true'
        run: |
          FILE=$(find backup -maxdepth 1 -name '*.json' -type f | head -n 1)
          test -n "$FILE"
          node - "$FILE" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const raw = fs.readFileSync(file, 'utf8').trim();
          if (!raw) throw new Error('El respaldo está vacío');
          function parseJsonStream(input) {
            let start = 0;
            while (/\s/.test(input[start] || '')) start++;
            if (input[start] !== '{' && input[start] !== '[') throw new Error('El respaldo no comienza con JSON');
            let depth = 0, inString = false, escaped = false, end = -1;
            for (let i = start; i < input.length; i++) {
              const ch = input[i];
              if (inString) {
                if (escaped) escaped = false;
                else if (ch === '\\\\') escaped = true;
                else if (ch === '"') inString = false;
                continue;
              }
              if (ch === '"') inString = true;
              else if (ch === '{' || ch === '[') depth++;
              else if (ch === '}' || ch === ']') {
                depth--;
                if (depth === 0) { end = i + 1; break; }
              }
            }
            if (end < 0) throw new Error('El JSON del respaldo está incompleto');
            const first = JSON.parse(input.slice(start, end));
            const trailerText = input.slice(end).trim();
            if (trailerText) {
              const trailer = JSON.parse(trailerText);
              if (!trailer || trailer.status !== 'success') throw new Error('La respuesta final de Firebase no confirma success');
            }
            return first;
          }
          let value = parseJsonStream(raw);
          if (value && !Array.isArray(value) && value.status === 'success' && Object.prototype.hasOwnProperty.call(value, 'result')) {
            value = typeof value.result === 'string' ? JSON.parse(value.result) : value.result;
          }
          if (!value || typeof value !== 'object' || Array.isArray(value)) {
            throw new Error('La raíz del respaldo no es un objeto JSON de Realtime Database');
          }
          const normalized = JSON.stringify(value);
          JSON.parse(normalized);
          fs.writeFileSync(file, normalized + '\\n');
          console.log('Respaldo JSON válido y normalizado:', file, fs.statSync(file).size, 'bytes');
          NODE
      - name: Upload backup artifact
        if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sendwayo-rtdb-backup-${{ github.run_number }}
          path: backup/*.json
          retention-days: 30
