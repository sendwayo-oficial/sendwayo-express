name: SENDWAYO - daily Firebase backup
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase credentials
        id: guard
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT no está configurado; respaldo omitido sin marcar el workflow como fallido."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 20
      - name: Install Firebase CLI
        if: steps.guard.outputs.ready == 'true'
        run: npm install -g firebase-tools
      - name: Prepare service account
        if: steps.guard.outputs.ready == 'true'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Export Realtime Database
        if: steps.guard.outputs.ready == 'true'
        run: |
          mkdir -p backup
          firebase database:get / --project sendwayo-express --json > "backup/sendwayo-rtdb-$(date -u +%Y-%m-%d).json"
      - name: Validate and normalize backup JSON
        if: steps.guard.outputs.ready == 'true'
        run: |
          FILE=$(find backup -maxdepth 1 -name '*.json' -type f | head -n 1)
          test -n "$FILE"
          node - "$FILE" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const raw = fs.readFileSync(file, 'utf8').trim();
          if (!raw) throw new Error('El respaldo está vacío');
          let value = JSON.parse(raw);
          // Firebase CLI puede envolver la respuesta en {status,result}.
          if (value && !Array.isArray(value) && value.status === 'success' && Object.prototype.hasOwnProperty.call(value, 'result')) {
            value = typeof value.result === 'string' ? JSON.parse(value.result) : value.result;
          }
          if (!value || typeof value !== 'object' || Array.isArray(value)) {
            throw new Error('La raíz del respaldo no es un objeto JSON de Realtime Database');
          }
          const normalized = JSON.stringify(value);
          JSON.parse(normalized);
          fs.writeFileSync(file, normalized + '\n');
          console.log('Respaldo JSON válido y normalizado:', file, fs.statSync(file).size, 'bytes');
          NODE
      - name: Upload backup artifact
        if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sendwayo-rtdb-backup-${{ github.run_number }}
          path: backup/*.json
          retention-days: 30
