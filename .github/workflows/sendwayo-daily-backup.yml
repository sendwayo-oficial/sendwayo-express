name: SENDWAYO - daily Firebase backup
on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase credentials
        id: creds
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_SERVICE_ACCOUNT no está configurado; el respaldo se omite de forma segura."
          fi
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.available == 'true'
        with:
          node-version: 20
      - name: Install Firebase CLI
        if: steps.creds.outputs.available == 'true'
        run: npm install -g firebase-tools
      - name: Prepare service account
        if: steps.creds.outputs.available == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Export Realtime Database
        if: steps.creds.outputs.available == 'true'
        run: |
          mkdir -p backup
          firebase database:get / --project sendwayo-express --json > "backup/sendwayo-rtdb-$(date -u +%Y-%m-%d).json"
      - name: Upload backup artifact
        if: steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sendwayo-rtdb-backup-${{ github.run_number }}
          path: backup/*.json
          retention-days: 30
