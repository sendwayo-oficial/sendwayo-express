name: SENDWAYO browser smoke test

on:
  workflow_run:
    workflows: ["Publish approved SENDWAYO EXPRESS - shared balances"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  welcome-and-login:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium browser test
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Open the published site and press the login button
        env:
          PAGE_URL: https://sendwayo-oficial.github.io/sendwayo-express/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            try {
              const page = await browser.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));
              const response = await page.goto(process.env.PAGE_URL, {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              if (!response || !response.ok()) {
                throw new Error('La página pública no respondió correctamente.');
              }

              await page.waitForFunction(() => {
                const welcome = document.querySelector('#welcome-landing');
                return welcome && getComputedStyle(welcome).display !== 'none' &&
                  getComputedStyle(welcome).visibility !== 'hidden';
              }, { timeout: 30000 });

              const loginButton = page.locator(
                '#welcome-landing button[onclick*="v162_showLogin"]'
              ).first();
              await loginButton.click({ timeout: 15000 });

              await page.waitForFunction(() => {
                const login = document.querySelector('#login-screen');
                const username = document.querySelector('#login-usuario');
                const password = document.querySelector('#login-password');
                return login && username && password &&
                  getComputedStyle(login).display !== 'none' &&
                  getComputedStyle(login).visibility !== 'hidden' &&
                  !login.classList.contains('hidden');
              }, { timeout: 20000 });

              const ready = await page.evaluate(() => ({
                usernameEnabled: !document.querySelector('#login-usuario').disabled,
                passwordEnabled: !document.querySelector('#login-password').disabled,
                loginFunction: typeof window.intentarLogin === 'function'
              }));
              if (!ready.usernameEnabled || !ready.passwordEnabled || !ready.loginFunction) {
                throw new Error('El formulario apareció, pero no quedó listo para escribir e iniciar sesión.');
              }
              if (pageErrors.length) {
                throw new Error('Error JavaScript al abrir el acceso: ' + pageErrors.join(' | '));
              }
              console.log('PASS: bienvenida visible; botón abre el formulario; usuario y contraseña habilitados; módulo de acceso presente.');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
