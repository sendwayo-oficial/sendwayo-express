name: SENDWAYO browser smoke test

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Publish approved SENDWAYO EXPRESS - shared balances"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  welcome-and-login:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright client
        run: |
          npm init -y
          npm install --no-save playwright

      - name: Open the public page and verify the single login button
        env:
          PAGE_URL: https://sendwayo-oficial.github.io/sendwayo-express/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              channel: 'chrome',
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            try {
              const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.message));

              const target = new URL(process.env.PAGE_URL);
              if (process.env.DEPLOYED_SHA) target.searchParams.set('sendwayo_release', process.env.DEPLOYED_SHA);
              console.log('Smoke test URL:', target.toString());

              const response = await page.goto(target.toString(), {
                waitUntil: 'commit',
                timeout: 45000
              });
              if (!response || response.status() !== 200) {
                throw new Error('La página pública no respondió HTTP 200.');
              }

              await page.waitForSelector('#welcome-landing .sendwayo-landing-logo', {
                state: 'visible',
                timeout: 45000
              });
              await page.waitForFunction(() =>
                typeof window.sendwayoOpenWelcomeLogin === 'function' &&
                typeof window.v162_showLogin === 'function',
                null,
                { timeout: 60000 }
              );

              const landing = await page.evaluate(() => {
                const welcome = document.querySelector('#welcome-landing');
                const logo = welcome && welcome.querySelector('.sendwayo-landing-logo');
                const title = welcome && welcome.querySelector('.sendwayo-landing-title');
                const buttons = welcome ? [...welcome.querySelectorAll('button')].filter(button =>
                  getComputedStyle(button).display !== 'none' &&
                  getComputedStyle(button).visibility !== 'hidden'
                ) : [];
                return {
                  welcomeVisible: !!welcome && getComputedStyle(welcome).display !== 'none' &&
                    getComputedStyle(welcome).visibility !== 'hidden',
                  logoLoaded: !!logo && logo.complete && logo.naturalWidth > 0,
                  logoWidth: logo && getComputedStyle(logo).width,
                  businessName: title && (title.textContent || '').trim(),
                  visibleButtonCount: buttons.length,
                  loginButtonPresent: !!welcome && !!welcome.querySelector('#sendwayo-home-login'),
                  registerButtonAbsent: !document.querySelector('#sendwayo-home-register'),
                  photoAbsent: !welcome || !welcome.querySelector('.sendwayo-welcome-only-photo')
                };
              });
              console.log('WELCOME STATE:', JSON.stringify(landing, null, 2));
              if (!landing.welcomeVisible || !landing.logoLoaded ||
                  landing.businessName !== 'SENDWAYO EXPRESS' ||
                  landing.visibleButtonCount !== 1 || !landing.loginButtonPresent ||
                  !landing.registerButtonAbsent || !landing.photoAbsent) {
                throw new Error('La portada no coincide con logo compacto, nombre y un único botón Ingresar.');
              }

              await page.locator('#sendwayo-home-login').click({ timeout: 15000 });
              await page.waitForFunction(() => {
                const login = document.querySelector('#login-screen');
                const username = document.querySelector('#login-usuario');
                const password = document.querySelector('#login-password');
                return !!login && !login.classList.contains('hidden') &&
                  getComputedStyle(login).display !== 'none' &&
                  getComputedStyle(login).visibility !== 'hidden' &&
                  !!username && !!password && !username.disabled && !password.disabled;
              }, null, { timeout: 30000 });

              const login = await page.evaluate(() => ({
                loginVisible: getComputedStyle(document.querySelector('#login-screen')).display !== 'none',
                usernamePresent: !!document.querySelector('#login-usuario'),
                passwordPresent: !!document.querySelector('#login-password'),
                welcomeHidden: getComputedStyle(document.querySelector('#welcome-landing')).display === 'none',
                loginHandler: typeof window.intentarLogin === 'function'
              }));
              console.log('LOGIN FORM STATE:', JSON.stringify(login, null, 2));
              if (!login.loginVisible || !login.usernamePresent || !login.passwordPresent ||
                  !login.welcomeHidden || !login.loginHandler) {
                throw new Error('El botón Ingresar no abrió un formulario utilizable.');
              }
              if (pageErrors.length) {
                console.error('PAGE ERRORS:', JSON.stringify(pageErrors, null, 2));
                throw new Error('La página produjo errores JavaScript.');
              }
              console.log('PASS: URL pública responde, logo pequeño y nítido, un solo botón y formulario de ingreso operativo.');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
