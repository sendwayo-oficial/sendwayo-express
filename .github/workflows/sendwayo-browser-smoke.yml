name: SENDWAYO direct-login browser smoke test

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  direct-login:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright

      - name: Verify the published login page in Chromium
        env:
          PAGE_URL: https://sendwayo-oficial.github.io/sendwayo-express/SENDWAYO-V118-SIN-SELLO-4000-GOURDES.html
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try {
              const page = await browser.newPage({viewport:{width:1280,height:900}});
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              const response = await page.goto(process.env.PAGE_URL + '?smoke=' + Date.now(), {waitUntil:'domcontentloaded',timeout:60000});
              if (!response || response.status() !== 200) throw new Error('La página pública no respondió HTTP 200.');
              await page.waitForSelector('#login-email', {state:'visible',timeout:30000});
              await page.locator('#login-email').fill('prueba@example.com');
              await page.locator('#login-password').fill('prueba-no-valida');
              await page.locator('#show-password').click();
              if (await page.locator('#login-password').getAttribute('type') !== 'text') throw new Error('El botón Ver no muestra la contraseña.');
              await page.locator('#show-password').click();
              if (await page.locator('#login-password').getAttribute('type') !== 'password') throw new Error('El botón Ocultar no vuelve a ocultar la contraseña.');
              await page.locator('#remember-me').check();
              if (!await page.locator('#remember-me').isChecked()) throw new Error('Recordarme no responde.');
              if (await page.locator('#forgot-password').count() !== 1) throw new Error('Debe existir un único enlace de recuperación.');
              await page.locator('#register-button').click();
              await page.waitForSelector('#register-modal.open', {state:'visible',timeout:10000});
              for (const id of ['register-name','register-phone','register-email']) {
                await page.locator('#'+id).fill('prueba');
                if (await page.locator('#'+id).inputValue() !== 'prueba') throw new Error('El campo '+id+' no acepta escritura.');
              }
              await page.locator('#close-register').click();
              await page.locator('#login-email').fill('');
              await page.locator('#login-password').fill('');
              await page.locator('#login-button').click();
              await page.waitForFunction(() => (document.querySelector('#login-status')?.textContent || '').includes('Escriba su correo'));
              const logo = await page.locator('.brand-logo').evaluate(img => ({complete:img.complete,width:img.naturalWidth}));
              if (!logo.complete || logo.width < 1) throw new Error('El logo no cargó correctamente.');
              if (errors.length) throw new Error('Errores JavaScript: '+errors.join(' | '));
              console.log('PASS: campos editables, mostrar/ocultar, Recordarme, recuperación única, Registrar, validación de Ingresar y logo.');
            } finally { await browser.close(); }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
