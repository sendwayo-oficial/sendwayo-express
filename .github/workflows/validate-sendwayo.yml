name: Validar SENDWAYO EXPRESS

on:
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S|re.I)
          if not scripts:
              raise SystemExit("No se encontró JavaScript inline")
          for i,s in enumerate(scripts,1):
              p=Path(f"/tmp/sendwayo-{i}.js")
              p.write_text(s,encoding="utf-8")
              print(f"Script {i}: {len(s.splitlines())} líneas")
          print("Scripts encontrados:",len(scripts))
          PY
      - name: Comprobar sintaxis JavaScript
        run: |
          for f in /tmp/sendwayo-*.js; do
            echo "=== $f ==="
            node --check "$f"
          done
      - name: Validate V31 fusion candidate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("v31-prueba.html").read_text(encoding="utf-8")
          if "</script>  </body></html>" in html[:-200]:
              raise SystemExit("V31 aún contiene un cierre de script incrustado sin escapar")
          scripts=re.findall(r"<script[^>]*>(.*?)</script>", html, re.S|re.I)
          if len(scripts) < 25:
              raise SystemExit(f"V31: solo se reconocieron {len(scripts)} bloques de script; revise el HTML")
          out=Path("/tmp/sendwayo-v31")
          out.mkdir(exist_ok=True)
          for i, code in enumerate(scripts,1):
              if code.strip():
                  (out/f"{i}.js").write_text(code,encoding="utf-8")
          print("V31: bloques reales reconocidos:",len(scripts))
          PY
          for f in /tmp/sendwayo-v31/*.js; do
            echo "=== $f ==="
            node --check "$f"
          done
          grep -q 'window.sendwayoCloud' v31-prueba.html
          grep -q 'resolveOrBootstrapProfile' v31-prueba.html
          grep -q 'submitOperation' v31-prueba.html
          echo "V31 cloud API markers OK"
      - name: Preflight real Firebase Point A and callable backend
        run: |
          set -eu
          INIT_URL="https://sendwayo-express-app-101.web.app/__/firebase/init.js"
          curl --fail --location --silent --show-error --max-time 20 "$INIT_URL" -o /tmp/sw-firebase-init.js
          grep -q 'sendwayo-express-app-101' /tmp/sw-firebase-init.js || { echo "::error::Firebase Hosting init.js does not identify the expected project"; exit 1; }
          for fn in resolveOrBootstrapProfile submitOperation reviewOperation adjustAccount; do
            code=$(curl --silent --show-error --max-time 20 -o "/tmp/sw-${fn}.json" -w '%{http_code}' -H 'Content-Type: application/json' -d '{"data":{}}' "https://us-central1-sendwayo-express-app-101.cloudfunctions.net/$fn")
            echo "$fn unauthenticated probe HTTP $code"
            case "$code" in
              200|400|401|403) ;;
              404) echo "::error::Firebase callable function $fn was not found in Point A"; cat "/tmp/sw-${fn}.json"; exit 1 ;;
              *) echo "::error::Unexpected response from $fn"; cat "/tmp/sw-${fn}.json"; exit 1 ;;
            esac
          done
          echo "Firebase project and critical callable endpoints respond."
