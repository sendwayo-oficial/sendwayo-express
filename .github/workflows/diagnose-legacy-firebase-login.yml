name: SENDWAYO — Diagnose legacy login data (read only)
# Forced read-only login audit requested on 2026-10-16; inspect account/profile alignment only, never write credentials or financial data.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-legacy-firebase-login.yml"
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Read-only inspection of legacy Firebase project sendwayo-express"
        required: true
        type: choice
        options:
          - "CANCEL"
          - "DIAGNOSE sendwayo-express"

permissions:
  contents: read

concurrency:
  group: sendwayo-legacy-login-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Check legacy Authentication and Realtime Database without writes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      EXPECTED_PROJECT: sendwayo-express
      CONFIRM_PROJECT: ${{ inputs.confirm_project }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate the legacy service account
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$CONFIRM_PROJECT" != "DIAGNOSE sendwayo-express" ]; then
            echo "::error::Diagnostic cancelled because the exact legacy project was not confirmed."
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::This repository does not have FIREBASE_SERVICE_ACCOUNT configured; nothing was accessed or changed."
            exit 1
          fi
          node - <<'NODE'
          const key = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          if (key.type !== 'service_account' || key.project_id !== process.env.EXPECTED_PROJECT || !key.private_key || !key.client_email) {
            console.error('BLOCKED: the credential is not a service-account key for the legacy project.');
            process.exit(2);
          }
          console.log('Legacy project credential verified. Values are not printed.');
          NODE

      - name: Authenticate read-only diagnostic to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: sendwayo-express
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: sendwayo-express

      - name: Inspect Authentication and Realtime Database using read-only APIs
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)" node - <<'NODE'
          const token = process.env.ACCESS_TOKEN;
          const projectId = process.env.EXPECTED_PROJECT;
          if (!token) throw new Error('Google Cloud access token was not available.');
          async function getJson(url) {
            const response = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
            const body = await response.text();
            let data;
            try { data = JSON.parse(body); } catch { data = { raw: body.slice(0, 300) }; }
            if (!response.ok) {
              const reason = data?.error?.status || data?.error?.message || ('HTTP_' + response.status);
              throw new Error('Read-only Firebase API failed: ' + reason);
            }
            return data;
          }
          const normalizeRole = value => {
            const role = String(value || '').trim().toLowerCase();
            if (['admin', 'administrador'].includes(role)) return 'admin';
            if (['agent', 'agente'].includes(role)) return 'agent';
            if (['remitente', 'sender', 'remitter'].includes(role)) return 'remitente';
            return 'other';
          };
          async function main() {
            const project = await getJson('https://cloudresourcemanager.googleapis.com/v1/projects/' + encodeURIComponent(projectId));
            const number = String(project.projectNumber || '');
            if (!number) throw new Error('Google Cloud did not return a project number.');
            const dbs = await getJson('https://firebasedatabase.googleapis.com/v1beta/projects/' + number + '/locations/-/instances');
            const instances = Array.isArray(dbs.instances) ? dbs.instances : [];
            if (!instances.length) throw new Error('No Realtime Database instances were returned for the legacy project.');
            const preferred = instances.find(x => x.databaseUrl && /default|sendwayo/i.test(x.name || x.databaseUrl)) || instances.find(x => x.databaseUrl);
            if (!preferred?.databaseUrl) throw new Error('The Realtime Database instance did not include a database URL.');
            const dbBase = String(preferred.databaseUrl).replace(/\/$/, '');
            let authUsers = 0, adminAuthExists = false, adminAuthDisabled = null, pageToken = '';
            do {
              const qs = new URLSearchParams({ maxResults: '1000' });
              if (pageToken) qs.set('nextPageToken', pageToken);
              const page = await getJson('https://identitytoolkit.googleapis.com/v1/projects/' + encodeURIComponent(projectId) + '/accounts:batchGet?' + qs.toString());
              const rows = Array.isArray(page.users) ? page.users : [];
              authUsers += rows.length;
              for (const user of rows) {
                if (String(user.email || '').trim().toLowerCase() === 'sendwayoexpress@gmail.com') {
                  adminAuthExists = true;
                  adminAuthDisabled = Boolean(user.disabled);
                }
              }
              pageToken = page.nextPageToken || '';
            } while (pageToken);

            const usersValue = await getJson(dbBase + '/sendwayo_express_v2/users.json');
            const records = usersValue && typeof usersValue === 'object' && !Array.isArray(usersValue)
              ? Object.entries(usersValue).filter(([, value]) => value && typeof value === 'object')
              : [];
            const byRole = { admin: 0, agent: 0, remitente: 0, other: 0 };
            let active = 0, withAuthUid = 0, withAuthEmail = 0, withUsername = 0;
            let adminRecordExists = false, adminHasAuthUid = false, adminHasAuthEmail = false;
            for (const [id, row] of records) {
              const role = normalizeRole(row.role || row.rol || (id.toLowerCase() === 'admin' ? 'admin' : ''));
              byRole[role]++;
              if (row.active !== false && row.disabled !== true && !['inactive', 'disabled', 'inactivo'].includes(String(row.status || '').toLowerCase())) active++;
              if (String(row.authUid || '').trim()) withAuthUid++;
              if (String(row.authEmail || row.email || '').includes('@')) withAuthEmail++;
              if (String(row.username || '').trim()) withUsername++;
              if (id.toLowerCase() === 'admin' || role === 'admin' || String(row.authEmail || row.email || '').trim().toLowerCase() === 'sendwayoexpress@gmail.com') {
                adminRecordExists = true;
                adminHasAuthUid = Boolean(String(row.authUid || '').trim());
                adminHasAuthEmail = Boolean(String(row.authEmail || row.email || '').includes('@'));
              }
            }
            console.log('READ-ONLY LEGACY LOGIN DIAGNOSTIC');
            console.log('Legacy Firebase project verified: ' + projectId);
            console.log('Realtime Database instances found: ' + instances.length);
            console.log('Firebase Authentication users: ' + authUsers);
            console.log('Realtime Database user records: ' + records.length);
            console.log('Legacy records by role: ' + JSON.stringify(byRole));
            console.log('Records marked active by stored status: ' + active);
            console.log('Records with Firebase Auth UID: ' + withAuthUid);
            console.log('Records with email for Firebase Auth: ' + withAuthEmail);
            console.log('Records with username field: ' + withUsername);
            console.log('Legacy admin user record exists: ' + (adminRecordExists ? 'yes' : 'no'));
            console.log('Legacy admin record has Auth UID: ' + (adminHasAuthUid ? 'yes' : 'no'));
            console.log('Legacy admin record has Auth email: ' + (adminHasAuthEmail ? 'yes' : 'no'));
            console.log('Admin Authentication account exists: ' + (adminAuthExists ? 'yes' : 'no'));
            console.log('Admin Authentication account disabled: ' + (adminAuthDisabled === null ? 'not applicable' : (adminAuthDisabled ? 'yes' : 'no')));
            console.log('No emails beyond the admin existence check, usernames, passwords, balances, or record content were printed. No data was written.');
          }
          main().catch(err => {
            console.error('Legacy read-only diagnostic failed:', err?.message || 'unknown');
            process.exit(1);
          });
          NODE
