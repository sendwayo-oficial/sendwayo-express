name: SENDWAYO - cierre financiero diario 22:00
on:
  schedule:
    - cron: '5 2 * * *'
  workflow_dispatch:
    inputs:
      close_date:
        description: 'Fecha local RD a cerrar (YYYY-MM-DD)'
        required: false
jobs:
  close:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase credentials
        id: guard
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT no está configurado; cierre no ejecutado."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 20
      - name: Install Firebase CLI
        if: steps.guard.outputs.ready == 'true'
        run: npm install -g firebase-tools
      - name: Prepare service account
        if: steps.guard.outputs.ready == 'true'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Read Firebase snapshot
        if: steps.guard.outputs.ready == 'true'
        run: firebase database:get / --project sendwayo-express --json > sendwayo-rtdb.json
      - name: Build daily close
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOSE_DATE: ${{ inputs.close_date }}
        run: node scripts/sendwayo-daily-close.mjs < sendwayo-rtdb.json > daily-close.json
      - name: Validate daily close report
        if: steps.guard.outputs.ready == 'true'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('daily-close.json', 'utf8'));
          if (!/^\d{4}-\d{2}-\d{2}$/.test(report.closeDate || '')) throw new Error('closeDate inválida');
          for (const key of ['operationsApproved','totalAmount','grossCommission','adminCommission','remitterCommission','agentCommission']) {
            if (!Number.isFinite(Number(report[key]))) throw new Error('Campo financiero inválido: ' + key);
          }
          if (!['CERRADO','REVISAR'].includes(report.status)) throw new Error('Estado del cierre inválido');
          if (!Array.isArray(report.issues) || !report.byCollection || typeof report.byCollection !== 'object') throw new Error('Estructura del cierre incompleta');
          console.log('Cierre diario validado:', report.closeDate, report.status, report.operationsApproved, 'operaciones');
          NODE
      - name: Upload close artifact
        if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sendwayo-daily-close-${{ github.run_number }}
          path: daily-close.json
          retention-days: 90
      - name: Store daily close report
        if: steps.guard.outputs.ready == 'true'
        run: |
          CLOSE_DATE=$(node -e "const r=require('./daily-close.json');process.stdout.write(r.closeDate)")
          firebase database:set "sendwayo_express_v2/dailyReports/$CLOSE_DATE" daily-close.json --project sendwayo-express --confirm
