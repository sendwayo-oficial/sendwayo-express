<!DOCTYPE html>
<!-- SENDWAYO V30: archivo único auditado; observer circular corregido; mantiene las reglas de balance y comisión del sistema base. -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SENDWAYO EXPRESS — Fusión A+B V31.1, candidato de prueba</title>
<style id="sw-v26-side-panel-style">@media(max-width:640px){#sendwayo-public-request-admin{left:10px!important;right:10px!important;top:70px!important;bottom:10px!important;width:auto!important;max-width:none!important;max-height:calc(100vh - 80px)!important}}</style></head>
<body>
<div id="sendwayo-preview-notice" role="status" style="position:relative;z-index:1000000;box-sizing:border-box;width:100%;padding:9px 14px;background:#fff4d6;border-bottom:1px solid #e7b64b;color:#533b00;font:600 12px/1.45 system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center">
  <span>V31 PARA REVISIÓN: candidato corregido. No es producción; la conexión y los flujos financieros deben verificarse en Firebase antes de publicar.</span>
  <button type="button" aria-label="Cerrar aviso de prueba" onclick="document.getElementById('sendwayo-preview-notice')?.remove()" style="flex:none;border:1px solid #a87612;border-radius:6px;background:#fff9e9;color:#533b00;padding:3px 8px;cursor:pointer">Cerrar</button>
</div>

<style>
#sendwayo-platform-watermark{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:1;}
#root{position:relative;z-index:1;}
/* Marca de agua tenue en fondo - 9 logos ya gestionados por JS */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image: none;
}
/* Asegurar que botones Ajustar esten habilitados para admin */
button:disabled{opacity:0.5;cursor:not-allowed;}
/* Beneficiario centrado en recibo ya gestionado por JS */
</style>

<style>
.logo-atractivo {
  background: linear-gradient(90deg, #FF7A00 0%, #0A245E 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 900;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
}
</style>
<style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<style id="sendwayo-final-visual-fixes">
/* Correcciones visuales finales: logo del comprobante siempre recto y nombre corporativo naranja/azul. */
#sendwayo-generic-receipt img[alt="SENDWAYO EXPRESS"]{
  transform:none !important;
  rotate:0deg !important;
  skew:0deg !important;
  display:block;
  flex:none;
}
#sendwayo-generic-receipt > div{
  max-width:390px !important;
  width:calc(100vw - 20px) !important;
  max-height:calc(100dvh - 20px) !important;
}
#sendwayo-generic-receipt > div > div{
  box-sizing:border-box;
}
#sendwayo-generic-receipt [data-receipt-header-logo]{
  transform:none !important;
}
@media (max-width:480px){
  #sendwayo-generic-receipt{padding:8px !important;}
  #sendwayo-generic-receipt > div{
    width:calc(100vw - 16px) !important;
    max-width:390px !important;
    max-height:calc(100dvh - 16px) !important;
    border-radius:14px !important;
  }
}

function loadSendwayoUsers(){

  const defaults=makeSendwayoDefaultUsers();

    const map=new Map(saved.map(x=>[`${x.role}|${x.name}|${x.id||""}`,x]));
    const merged=defaults.map(d=>{
      const old=map.get(`${d.role}|${d.name}|${d.id||""}`)||{};
      return {...d,...old,identifiers:[...new Set([...(d.identifiers||[]),...((old&&old.identifiers)||[])])]};
    });
    const deleted=new Set(saved.filter(d=>d&&d.__deleted).map(d=>`${d.role}|${d.name}|${d.id||""}`));
    const cleanMerged=merged.filter(d=>!deleted.has(`${d.role}|${d.name}|${d.id||""}`));
    const known=new Set(cleanMerged.map(d=>`${d.role}|${d.name}|${d.id||""}`));
    const extras=saved.filter(d=>d&&d.role&&["admin","agent","remitente"].includes(d.role)&&!d.__deleted&&!known.has(`${d.role}|${d.name}|${d.id||""}`));
    extras.forEach(u=>{
      const legacy=u.legacyId||u.id, full=String(u.name||"").trim(), parts=full.split(/\s+/), first=parts.shift()||full, last=parts.join(" ");
      if(u.role==="remitente" && typeof cm!=="undefined" && !cm.some(a=>String(a.id)===String(legacy)||String(a.id)===String(u.id))){cm.push({id:legacy,name:first,last,first,phone:u.phone||"",code:u.code||u.id,balance:0,balanceDOP:0,balanceHTG:0,commission:0,commissionDOP:0,commissionHTG:0,pais:u.pais||"RD"})}

    });
    return [...cleanMerged,...extras];
  }catch(e){return defaults}

async function hashSendwayoPassword(value){
  try{
    if(!globalThis.crypto?.subtle || typeof TextEncoder === "undefined") return null;
    const bytes = new TextEncoder().encode(String(value));
    const digest = await globalThis.crypto.subtle.digest("SHA-256", bytes);
    return Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){ return null; }
}

function enforceRBAC(){
  const r = role();
  const allowed = getAllowedPages(r);

  document.querySelectorAll("#sidebar button, [id*='sidebar'] button, nav button").forEach(b=>{

    else if(txt.includes("beneficiaire")) pageKey="beneficiarios";
    else if(txt.includes("expediteur")||txt.includes("remitente")) pageKey="remitentes";
    else if(txt.includes("agente")) pageKey="agentes";
    else if(txt.includes("recarga")) pageKey="recargas";
    else if(txt.includes("paquetiko")) pageKey="paquetikos";
    else if(txt.includes("recepción")||txt.includes("distribución")||txt.includes("paquetes")) pageKey="paquetes";

    else if(txt.includes("cuenta")) pageKey="cuentas";
    else if(txt.includes("comision")) pageKey="comisiones";
    else if(txt.includes("conciliacion")) pageKey="conciliacion";
    else if(txt.includes("reporte")) pageKey="reportes";
    else if(txt.includes("informe")) pageKey="informes";

        b.disabled=true;

function parseBeneficiario(benefStr){
  // Esperado formato "Nombre (Telefono)" o "Telefono (Nombre)" o solo nombre
  if(!benefStr) return {nombre:"—", telefono:""};
  let nombre = benefStr;
  let telefono = "";
  const matchParen = benefStr.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
  if(matchParen){
    const part1 = matchParen[1].trim();
    const part2 = matchParen[2].trim();
    // Si part2 parece telefono (numeros, +, -, espacios)
    if(/^[\d\s\+\-\(\)]+$/.test(part2) || part2.replace(/\D/g,"").length>=7){
      nombre = part1;
      telefono = part2;
    } else if(/^[\d\s\+\-\(\)]+$/.test(part1) || part1.replace(/\D/g,"").length>=7){
      nombre = part2;
      telefono = part1;
    } else {
      nombre = benefStr;
    }
  } else {
    // Intentar separar si contiene telefono al final
    const phoneMatch = benefStr.match(/(\+?\d[\d\s\-\(\)]{6,}\d)/);
    if(phoneMatch){
      telefono = phoneMatch[1].trim();
      nombre = benefStr.replace(phoneMatch[1],"").trim();
    }
  }
  return {nombre: nombre||"—", telefono: telefono||""};
}

}

function getAllBeneficiarios(){
  try{
    const a=api();
    const list=[];
    if(a.beneficiarios) list.push(...a.beneficiarios.map(b=>({nombre:`${b.nombre||b.name||""} ${b.apellido||b.last||""}`.trim(), phone:b.phone||"", code:b.code||""})));

    if(a.remitentes) list.push(...a.remitentes.map(b=>({nombre:`${b.name||""} ${b.last||""}`.trim(), phone:b.phone||"", code:b.code||""})));
    // Deduplicar por nombre+phone
    const map=new Map();
    list.forEach(x=>{
      if(!x.nombre) return;
      const key=`${x.nombre}|${x.phone}`;
      if(!map.has(key)) map.set(key,x);
    });
    return Array.from(map.values()).filter(x=>x.nombre);
  }catch{return []}
}

      const showSuggestions = (q)=>{
        const all=getAllBeneficiarios();
        const query=(q||"").toLowerCase();
        const filtered = all.filter(b=>{
          const name=(b.nombre||"").toLowerCase();
          const phone=(b.phone||"").replace(/\D/g,"");
          const qDigits=query.replace(/\D/g,"");
          return name.includes(query) || (qDigits && phone.includes(qDigits));
        }).slice(0,12);
        if(filtered.length===0){wrapper.style.display="none";return;}
        wrapper.innerHTML="";
        filtered.forEach(b=>{
          const display = `${b.nombre} (${b.phone||b.code||""})`;
          const div=document.createElement("div");
          div.style.cssText="padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center;";
          div.innerHTML=`<span style="font-weight:700;color:#0a245e">${b.nombre}</span><span style="font-family:monospace;font-size:11px;color:#6b7280">(${b.phone})</span>`;
          div.onclick=()=>{
            inp.value=display;
            wrapper.style.display="none";
            inp.dispatchEvent(new Event("input",{bubbles:true}));
            inp.dispatchEvent(new Event("change",{bubbles:true}));
          };
          wrapper.appendChild(div);
        });
        const rect=inp.getBoundingClientRect();
        wrapper.style.left=(rect.left+window.scrollX)+"px";
        wrapper.style.top=(rect.bottom+window.scrollY+4)+"px";
        wrapper.style.width=rect.width+"px";
        wrapper.style.display="block";
      };
      
      inp.addEventListener("input", (e)=>{
        const val=e.target.value;
        if(val.length>=1) showSuggestions(val);
        else wrapper.style.display="none";
      });
      inp.addEventListener("focus", (e)=>{
        if(e.target.value.length>=1) showSuggestions(e.target.value);
      });
      inp.addEventListener("blur", ()=>{
        setTimeout(()=>{wrapper.style.display="none";},200);
      });
    }
  });
}

function allPeople(){
  let out=[];
  for(const k of ['sendwayo_users','sendwayo_beneficiaries']){const a=read(k,[]);if(Array.isArray(a))out.push(...a)}
  const t=read('sendwayo_transactions',[]);
  if(Array.isArray(t))for(const x of t){
    if(x.beneficiario||x.beneficiarioId||x.telefono||x.phone)out.push({name:x.beneficiario||x.beneficiarioNombre||'',phone:x.telefono||x.phone||'',id:x.beneficiarioId||'',code:x.beneficiarioCode||''});
    if(x.remitente||x.remitenteId)out.push({name:x.remitente||x.remitenteNombre||'',phone:x.remitentePhone||'',id:x.remitenteId||'',code:x.remitenteCode||''});
  }
  const seen=new Set();return out.filter(u=>{const key=String(u.phone||u.code||u.id||u.name||'').toLowerCase()+'|'+String(u.name||'').toLowerCase();if(!key||seen.has(key))return false;seen.add(key);return true});
}
let sugBox=null,sugInput=null;
function installSuggestions(){
 document.querySelectorAll('input').forEach(inp=>{
  if(inp.dataset.swV18Suggest)return;
  const meta=((inp.placeholder||'')+' '+(inp.name||'')+' '+(inp.id||'')).toLowerCase();
  if(!/(benefici|remitent|agente|cliente|destinat|tel[eé]fono|phone|buscar|b[uú]squeda|nombre|c[oó]digo|identific|usuario)/i.test(meta))return;
  inp.dataset.swV18Suggest='1';
  inp.addEventListener('input',()=>{
   const q=inp.value.trim().toLowerCase();if(!q){if(sugBox){sugBox.remove();sugBox=null}return}
   const hits=allPeople().filter(u=>[u.name,u.phone,u.code,u.id,u.email].some(v=>String(v||'').toLowerCase().includes(q))).slice(0,10);
   if(sugBox){sugBox.remove();sugBox=null}if(!hits.length)return;

   sugBox.style.cssText='position:fixed;z-index:300000;background:#fff;border:2px solid #0a245e;border-radius:10px;box-shadow:0 16px 50px rgba(0,0,0,.22);max-height:280px;overflow:auto;min-width:280px';

   sugBox.innerHTML=hits.map((u,i)=>'<button type="button" data-i="'+i+'" style="display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-bottom:1px solid #edf0f4;background:#fff;color:#0f172a"><b>'+esc(u.phone||u.code||u.id||'')+'</b> <span>('+esc(u.name||'')+')</span></button>').join('');
   document.body.appendChild(sugBox);

function parseMoneyInput(value){
 const raw=String(value??"").trim().replace(/\s/g,"");if(!raw)return NaN;
 let norm=raw;
 if(norm.includes(",")&&norm.includes(".")){norm=norm.lastIndexOf(",")>norm.lastIndexOf(".")?norm.replace(/\./g,"").replace(",","."):norm.replace(/,/g,"")}
 else if(norm.includes(",")){norm=norm.replace(/\./g,"").replace(",",".")}
 return Number(norm);
}

}

<script >

   Cargar firebase-app-compat, firebase-auth-compat, firebase-firestore-compat,

(function () {

  const event = (name, detail = {}) => window.dispatchEvent(new CustomEvent(name, { detail }));
  const problem = new Error('Firebase no está configurado. Operaciones financieras deshabilitadas para evitar datos locales no sincronizados.');
  if (!window.firebase || !window.SENDWAYO_FIREBASE_CONFIG || String(window.SENDWAYO_FIREBASE_CONFIG.projectId || '').startsWith('REEMPLAZAR')) {
    window.sendwayoFirebaseReady = false;

    console.error('[SENDWAYO] Firebase no está configurado. No uses localStorage como fuente financiera.');
    event('sendwayo:cloud-error', { message: problem.message });
    window.sendwayoCloud = Object.freeze({ ready: false, requireReady() { throw problem; } });
    return;
  }
  if (!firebase.apps.length) firebase.initializeApp(window.SENDWAYO_FIREBASE_CONFIG);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const functions = firebase.app().functions('us-central1');
  const useEmulators = new URLSearchParams(window.location.search).get('emulator') === '1';

  async function profile() {

    // en varios campos; quitarlo de una consulta no debe borrarlo de las otras.
    const byQuery = new Map();

      const merged = new Map();
      for (const rows of byQuery.values()) for (const [id, row] of rows) merged.set(id, row);
      callback([...merged.values()].sort((a, b) => Number(b.createdAtMs || b.createdAt?.toMillis?.() || 0) - Number(a.createdAtMs || a.createdAt?.toMillis?.() || 0)));
    };
    const stops = ['actorUid', 'targetUid', 'sourceUid', 'ownerUid'].map(field => onSnap(db.collection('transactions').where(field, '==', user.uid), snap => {
      byQuery.set(field, new Map(snap.docs.map(doc => [doc.id, serial(doc)])));
      publish();
    }, `transactions:${field}`));
    return () => { stops.forEach(stop => stop()); byQuery.clear(); };
  }
  function listenAdminOperations(callback) {
    if (!auth.currentUser) throw new Error('Inicia sesión como administrador.');
    return onSnap(db.collection('transactions'), snap => callback(snap.docs.map(serial).sort((a, b) => Number(b.createdAtMs || b.createdAt?.toMillis?.() || 0) - Number(a.createdAtMs || a.createdAt?.toMillis?.() || 0))), 'admin-transactions');
  }
  function listenAccount(accountId, callback) {
    if (!auth.currentUser || !accountId) throw new Error('Falta sesión o identificador de cuenta.');
    return onSnap(db.collection('accounts').doc(String(accountId)), snap => {
      // Si el perfil está aprobado pero aún no existe el documento de saldo,
      // no se debe conservar en pantalla el balance antiguo del navegador.
      if (!snap.exists) return callback({ uid: String(accountId), balanceDOP: 0, balanceHTG: 0, commissionDOP: 0, commissionHTG: 0 });

  }
  function listenAllAccounts(callback) {
    if (!auth.currentUser) throw new Error('Inicia sesión para consultar las cuentas.');
    return onSnap(db.collection('accounts'), snap => callback(snap.docs.map(doc => ({ ...serial(doc), uid: doc.id }))), 'all-accounts');
  }
  function listenAllProfiles(callback) {
    if (!auth.currentUser) throw new Error('Inicia sesión para consultar perfiles.');
    return onSnap(db.collection('profiles'), snap => callback(snap.docs.map(doc => ({ ...serial(doc), uid: doc.id }))), 'all-profiles');
  }
  function listenSystemBalance(callback, target = 'admin') {
    if (!auth.currentUser) throw new Error('Inicia sesión para consultar el balance administrativo.');
    if (!['admin', 'operations'].includes(String(target))) throw new Error('Destino de balance administrativo no permitido.');
    return onSnap(db.collection('systemBalances').doc(String(target)), snap => {
      callback(snap.exists ? serial(snap) : null);
    }, `system-balance:${target}`);
  }
  function listenNotifications(callback) {
    if (!auth.currentUser) throw new Error('Inicia sesión para recibir notificaciones.');

    return onSnap(db.collection('notifications').doc(uid).collection('items'), snap => callback(snap.docs.map(serial).sort((a, b) => Number(b.createdAt?.toMillis?.() || 0) - Number(a.createdAt?.toMillis?.() || 0))), 'notifications');
  }

  }
  function listenBankAccounts(callback) {
    if (!auth.currentUser) throw new Error('Inicia sesión para consultar cuentas bancarias oficiales.');

  }
  function listenAllBankAccounts(callback) {
    if (!auth.currentUser) throw new Error('Inicia sesión como administrador.');

  }
  function listenAdminPackages(callback) {
    if (!auth.currentUser) throw new Error('Inicia sesión como administrador.');
    return onSnap(db.collection('packages'), snap => callback(snap.docs.map(serial).sort((a,b)=>Number(b.createdAtMs||0)-Number(a.createdAtMs||0))), 'admin-packages');
  }
  function listenAdminReceipts(callback) {
    if (!auth.currentUser) throw new Error('Inicia sesión como administrador para consultar comprobantes.');
    return onSnap(db.collection('receipts'), snap => callback(snap.docs.map(serial).sort((a, b) => Number(b.approvedAt?.toMillis?.() || 0) - Number(a.approvedAt?.toMillis?.() || 0))), 'admin-receipts');
  }
  function listenWelcomeRequests(callback) {
    if (!auth.currentUser) throw new Error('Inicia sesión como administrador.');
    return onSnap(db.collection('registrationRequests').where('status', '==', 'Pendiente'), snap => callback(snap.docs.map(serial)), 'welcome-requests');
  }
  function listenMyWelcomeRequest(callback) {
    if (!auth.currentUser) throw new Error('Inicia sesión.');
    const uid = auth.currentUser.uid;
    return onSnap(db.collection('registrationRequests').doc(uid), snap => callback(snap.exists ? serial(snap) : null), 'my-welcome-request');
  }
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(err => console.warn('[SENDWAYO] No se pudo establecer persistencia de sesión:', err));
  auth.onAuthStateChanged(user => {
    window.sendwayoCurrentUid = user?.uid || null;
    event('sendwayo:auth-changed', { user: user ? { uid: user.uid, email: user.email } : null });
  });
  window.sendwayoFirebaseReady = true;
  window.sendwayoCloud = Object.freeze({
    ready: true, auth, db,
    signIn: async (email, password) => (await auth.signInWithEmailAndPassword(String(email).trim(), password)).user,
    signOut: () => auth.signOut(),
    register: async ({ email, password, displayName, phone, username, requestedRole }) => {
      await auth.createUserWithEmailAndPassword(String(email).trim(), password);
      return invoke('submitRegistration')({ displayName, phone, username, email, requestedRole });
    },
    getProfile: profile,
    resolveOrBootstrapProfile: invoke('resolveOrBootstrapProfile'),
    submitOperation: invoke('submitOperation'),
    reviewOperation: invoke('reviewOperation'),
    resubmitOperation: invoke('resubmitOperation'),
    deleteRejectedOperation: invoke('deleteRejectedOperation'),
    importLegacyAccounts: invoke('importLegacyAccounts'),
    approveLegacyBalanceMigration: invoke('approveLegacyBalanceMigration'),
    reviewRegistration: invoke('reviewRegistration'),
    linkUserToAccount: invoke('linkUserToAccount'),
    adjustAccount: invoke('adjustAccount'),
    payCommission: invoke('payCommission'),
    saveBankAccount: invoke('saveBankAccount'),
    deleteBankAccount: invoke('deleteBankAccount'),
    savePackage: invoke('savePackage'),
    updatePackageStatus: invoke('updatePackageStatus'),
    updatePackageDetails: invoke('updatePackageDetails'),
    saveBeneficiary: invoke('saveBeneficiary'),
    deleteBeneficiary: invoke('deleteBeneficiary'),
    listenMyBeneficiaries: callback => { if (!auth.currentUser) throw new Error('Inicia sesión para consultar beneficiarios.'); const uid=auth.currentUser.uid; return onSnap(db.collection('beneficiaries').where('createdByUid','==',uid).where('active','==',true), snap=>callback(snap.docs.map(serial)), 'my-beneficiaries'); },
    listenAdminBeneficiaries: callback => { if (!auth.currentUser) throw new Error('Inicia sesión como administrador.'); return onSnap(db.collection('beneficiaries').where('active','==',true), snap=>callback(snap.docs.map(serial)), 'admin-beneficiaries'); },
    saveReconciliation: invoke('saveReconciliation'),
    cancelReconciliation: invoke('cancelReconciliation'),
    listenAdminReconciliations: callback => { if (!auth.currentUser) throw new Error('Inicia sesión como administrador.'); return onSnap(db.collection('reconciliations'), snap => callback(snap.docs.map(serial).sort((a,b)=>Number(b.createdAtMs||0)-Number(a.createdAtMs||0))), 'admin-reconciliations'); },
    listenMyOperations, listenAdminOperations, listenAccount, listenAllAccounts, listenAllProfiles, listenSystemBalance, listenNotifications,
    listenBankAccounts, listenAllBankAccounts, listenMyPackages, listenAdminPackages,
    listenReceipts, listenAdminReceipts, listenWelcomeRequests, listenMyWelcomeRequest,
    markNotificationRead: async (notificationId) => {
      // The client may mark its own notice read; status/amount fields are never edited here.
      const uid = auth.currentUser?.uid;

    },
    stopAllListeners: () => { for (const stop of [...cleanUnsubscribers]) { try { stop(); } catch (_) {} } cleanUnsubscribers.clear(); }
  });
  event('sendwayo:cloud-ready', { projectId: window.SENDWAYO_FIREBASE_CONFIG.projectId });
})();

<script id="sendwayo-v31-secure-adjustments">
(function(){
  'use strict';
  const pendingKey='sw_pending_admin_adjustment_v1';
  function parseMoney(raw){
    let s=String(raw??'').trim().replace(/\s/g,'');
    if(!s)return NaN;
    if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}
    else if(s.includes(',')){const parts=s.split(',');s=parts.length===2&&parts[1].length<=2?parts[0].replace(/,/g,'')+'.'+parts[1]:s.replace(/,/g,'')}
    return Number(s);
  }
  window.sendwayoAdjustmentApi=async function(options){
    const o=options||{},cloud=window.sendwayoCloud;
    if(!cloud?.ready||!cloud.auth?.currentUser||typeof cloud.adjustAccount!=='function'){
      alert('Firebase no está disponible. No se modificó ningún balance ni comisión.');return false;
    }
    if(o.uid!=='admin'&&o.uid!=='operations'&&(!o.uid||typeof o.uid!=='string')){alert('No se identificó la cuenta destinataria. No se aplicó el ajuste.');return false;}
    let amount=Number.isFinite(Number(o.fixedValue))?Number(o.fixedValue):null;
    if(amount===null){const raw=prompt(o.title||'Importe del ajuste','');if(raw===null)return false;amount=parseMoney(raw)}
    if(!Number.isFinite(amount)||(o.mode==='increment'?amount<=0:amount<0)){alert('El importe no es válido. No se aplicó el ajuste.');return false;}
    let reason=String(o.fixedReason||'').trim();
    if(!reason){reason=String(prompt('Motivo obligatorio para el registro de auditoría:','')||'').trim();if(!reason){alert('Debes indicar el motivo. No se aplicó el ajuste.');return false}}
    const payload={uid:String(o.uid),currency:o.currency||'DOP',kind:o.kind||'balance',mode:o.mode==='increment'?'increment':'set',value:amount,reason};
    const signature=JSON.stringify({actor:cloud.auth.currentUser.uid,...payload});
    let pending=null;try{pending=JSON.parse(localStorage.getItem(pendingKey)||'null')}catch{}
    if(!pending||pending.signature!==signature||!pending.id||Date.now()-Number(pending.createdAt||0)>86400000){
      pending={signature,id:`ADJ-${Date.now()}-${Math.random().toString(36).slice(2,10)}`,createdAt:Date.now()};
      try{localStorage.setItem(pendingKey,JSON.stringify(pending))}catch{}
    }
    try{
      const result=await cloud.adjustAccount({...payload,idempotencyKey:pending.id});
      try{const latest=JSON.parse(localStorage.getItem(pendingKey)||'null');if(latest?.id===pending.id)localStorage.removeItem(pendingKey)}catch{}
      alert(`Ajuste registrado en Firebase. ${payload.currency} · antes: ${Number(result.before||0).toLocaleString()} · después: ${Number(result.after||0).toLocaleString()}.`);
      return result;
    }catch(err){
      console.error('SENDWAYO: ajuste seguro rechazado/no confirmado',err);
      alert((err?.message||'No se pudo confirmar el ajuste.')+' No hagas otro movimiento con datos distintos hasta verificar el estado. Si reintentas los mismos datos, se reutilizará la clave de idempotencia.');
      return false;
    }
  };
})();
