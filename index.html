<style>

html,body{margin:0;min-height:100%;width:100%}

button{cursor:pointer;touch-action:manipulation}

.brand h1{margin:0;color:#102b49;font-size:clamp(23px,5vw,29px);font-weight:900;line-height:1.1;letter-spacing:.035em}
.brand p{margin:3px 0 0;color:#64748b;font-size:13px;font-weight:600}
.field{margin:0 0 15px}
.field label{display:block;margin:0 0 7px;color:#334155;font-size:12px;font-weight:800}
.field input{display:block;width:100%;height:49px;padding:12px 14px;border:1px solid #cbd5e1;border-radius:11px;background:#f8fafc;color:#10243d;font-size:16px;outline:none;transition:border-color .12s,box-shadow .12s}
.field input:focus{border-color:#2875ad;box-shadow:0 0 0 3px rgba(40,117,173,.14);background:#fff}
.password-wrap{display:flex;gap:8px;align-items:center}
.password-wrap input{flex:1;min-width:0}
.show-pass{height:43px;padding:0 13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:#23496d;font-size:12px;font-weight:800}
.extras{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:3px 0 20px}
.remember{display:flex;align-items:center;gap:7px;color:#475569;font-size:12px;cursor:pointer}
.remember input{width:16px;height:16px;margin:0;accent-color:#174a78}
.forgot{border:0;padding:5px 0;background:transparent;color:#1768a5;font-size:12px;font-weight:700;text-decoration:underline}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action{min-height:49px;padding:12px 15px;border-radius:11px;font-size:13px;font-weight:900;letter-spacing:.035em;transition:filter .12s,transform .12s}
.action:focus-visible,.show-pass:focus-visible,.forgot:focus-visible{outline:3px solid #1684bd;outline-offset:3px}
.action:hover{filter:brightness(1.05);transform:translateY(-1px)}
.login{border:1px solid #123b63;background:linear-gradient(135deg,#174b78,#0c2948);color:#fff;box-shadow:0 7px 16px rgba(16,43,73,.17)}
.register{border:1px solid #cbd5e1;background:#f1f5f9;color:#173554}
.status{min-height:0;margin:0;color:#475569;font-size:12px;line-height:1.45}
.status:not(:empty){margin-top:14px;padding:10px 12px;border:1px solid #dbe5ef;border-radius:10px;background:#f8fafc}
.status.error{border-color:#fecaca;background:#fef2f2;color:#991b1b}
.status.success{border-color:#bbf7d0;background:#f0fdf4;color:#166534}
.modal-backdrop{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(7,20,38,.72)}

.modal-actions button{min-height:45px;border-radius:10px;font-size:13px;font-weight:800}
.modal-save{border:0;background:#174b78;color:#fff}
.modal-cancel{border:1px solid #cbd5e1;background:#f1f5f9;color:#173554}
@media(max-width:520px){body{padding:12px}.entry-card{padding:24px 19px 21px;border-radius:21px}.brand{margin-bottom:21px}.brand-logo{width:155px;height:96px}.actions{grid-template-columns:1fr}.action{min-height:48px}.modal{padding:20px}}

<body>
<main class="entry-card" aria-labelledby="brand-title">
  <header class="brand">
    <img class="brand-logo" src="assets/sendwayo-logo-real.jpg" alt="SENDWAYO EXPRESS" width="180" height="112" fetchpriority="high" decoding="async">
    <h1 id="brand-title">SENDWAYO EXPRESS</h1>
    
  </header>
  <form id="login-form" novalidate>
    <div class="field">
      <label for="login-email">Correo electrónico o código</label>
      <input id="login-email" name="username" type="text" inputmode="email" autocomplete="username" value="admin-administrador" placeholder="Escriba su usuario, correo o código" required>
    </div>
    <div class="field">
      <label for="login-password">Contraseña</label>
      <div class="password-wrap">
        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Escriba su contraseña" required>
        <button class="show-pass" id="show-password" type="button" aria-label="Mostrar contraseña" aria-pressed="false">Ver</button>
      </div>
    </div>
    <div class="extras">
      <label class="remember"><input id="remember-me" type="checkbox"> Recordarme</label>
      <button class="forgot" id="forgot-password" type="button">¿Olvidaste tu contraseña?</button>
    </div>
    <div class="actions">
      <button class="action login" id="login-button" type="submit">INGRESAR</button>
      <button class="action register" id="register-button" type="button">REGISTRAR</button>
    </div>
    <div class="status" id="login-status" role="status" aria-live="polite"></div>
  </form>
</main>

<div class="modal-backdrop" id="register-modal" role="presentation" aria-hidden="true">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="register-title">
    <h2 id="register-title">Solicitud de registro</h2>
    <p>Complete sus datos. Administración revisará su solicitud para crear la cuenta.</p>
    <form id="register-form" novalidate>
      <div class="field"><label for="register-name">Nombre y apellido</label><input id="register-name" autocomplete="name" placeholder="Nombre completo" required></div>
      <div class="field"><label for="register-phone">Celular / WhatsApp</label><input id="register-phone" type="tel" autocomplete="tel" placeholder="Número de teléfono" required></div>
      <div class="field"><label for="register-email">Correo electrónico</label><input id="register-email" type="email" autocomplete="email" placeholder="correo@ejemplo.com" required></div>
      <div class="field"><label for="register-password">Crear contraseña</label><input id="register-password" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo 8 caracteres" required></div>
      <div class="field"><label for="register-password-confirm">Confirmar contraseña</label><input id="register-password-confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Repita su contraseña" required></div>
      <div class="field"><label for="register-details">Información adicional (opcional)</label><input id="register-details" placeholder="Detalle de la solicitud"></div>
      <div class="status" id="register-status" role="status" aria-live="polite"></div>
      <div class="modal-actions">
        <button class="modal-cancel" id="close-register" type="button">Volver</button>
        <button class="modal-save" id="send-register" type="submit">Enviar solicitud</button>
      </div>
    </form>
  </section>
</div>
